/* 🌟 FUNCIÓN GENÉRICA DE AUTOCOMPLETADO (Actualizada y corregida visualmente) */
function enableAutocomplete(input, listaOpciones) {
    // 1. Busca el contenedor 'autocomplete-wrapper' 
    const wrapper = input.closest('.autocomplete-wrapper');
    if (!wrapper) {
        console.error('El input debe estar dentro de un div con clase .autocomplete-wrapper');
        return;
    }

    // 2. Crear la lista si no existe
    let lista = wrapper.querySelector(".autocomplete-list");
    if (!lista) {
        lista = document.createElement("ul");
        lista.className = "autocomplete-list";
        lista.style.display = 'none'; // Oculta inicialmente
        wrapper.appendChild(lista);
    }

    input.addEventListener("input", () => {
        const val = input.value.toLowerCase();
        lista.innerHTML = '';
        if (!val) {
            lista.style.display = 'none'; 
            return;
        }
        
        const coincidencias = listaOpciones.filter(item => item.toLowerCase().includes(val));
        
        coincidencias.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            
            li.onmousedown = (e) => {
                e.preventDefault(); 
                input.value = item;
                lista.style.display = 'none'; 
                // Si el input está en la tabla, no intentar darle foco ya que puede ser molesto.
                if (!input.closest('td')) {
                    input.focus(); 
                }
            };
            lista.appendChild(li);
        });

        lista.style.display = coincidencias.length > 0 ? 'block' : 'none';
        // En el teléfono, mover la página lo justo para que la lista se vea completa
        if (coincidencias.length > 0) lista.scrollIntoView({ block: 'nearest' });
    });

    input.addEventListener("blur", () => {
        // Retraso para dar tiempo al onmousedown y que la lista no se cierre al hacer clic
        setTimeout(() => { lista.style.display = 'none'; }, 150);
    });
}


/* ➕ Añadir fila (Actualizada con wrapper) */

    tr.innerHTML = `

    const inputNuevo = tr.querySelector("input[type=text]");

}


/* ➖ Eliminar fila */
function removeRow() {
    const tbody = document.getElementById("tbody");
    if (tbody.rows.length > 1) tbody.deleteRow(tbody.rows.length - 1);
    else alert("Debe haber al menos un material.");
}

/* 📤 Enviar Solicitud (CORREGIDA) */
/* -------------------------------------------------------------------
    SOLICITUD PENDIENTE
    Un alumno con una solicitud sin entregar no puede crear otra,
    pero sí agregarle materiales. Los administradores no tienen esta restricción.
------------------------------------------------------------------- */
let solicitudPendiente = null;
const HORAS_PARA_AGREGAR = 2;   // plazo para agregar materiales a una solicitud pendiente

function limiteParaAgregar(sol) {
    return fechaSupabase(sol.fecha_solicitud).getTime() + HORAS_PARA_AGREGAR * 36e5;
}
function plazoVencido(sol) {
    return Date.now() >= limiteParaAgregar(sol);
}
function horaCorta(ms) {
    return new Date(ms).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
}

function textoBotonEnviar() {
    return solicitudPendiente ? `Agregar a la solicitud #${solicitudPendiente.id}` : "Enviar solicitud";
}

async function buscarPendiente() {
    if (!user || user.rol === "admin") return null;
    const { data, error } = await supabaseClient
        .from("solicitudes")
        .select("id, docente, asignatura, fecha_solicitud")
        .eq("email", user.email)
        .eq("estado", "Pendiente")
        .order("fecha_solicitud", { ascending: false })
        .limit(1);
    if (error) { console.error("Error al revisar solicitudes pendientes:", error); return null; }
    return (data && data[0]) || null;
}

async function activarModoAgregar() {
    solicitudPendiente = await buscarPendiente();
    if (!solicitudPendiente) return;
    const s = solicitudPendiente;

    // Docente y asignatura quedan fijos: son los de la solicitud pendiente
    const selDocente = document.getElementById("docente");
    if (![...selDocente.options].some(o => o.value === s.docente)) selDocente.add(new Option(s.docente, s.docente));
    selDocente.value = s.docente;
    selDocente.disabled = true;
    const inpAsignatura = document.getElementById("asignatura");
    inpAsignatura.value = s.asignatura;
    inpAsignatura.disabled = true;

    const aviso = document.getElementById("avisoPendiente");
    aviso.hidden = false;
    const vencido = plazoVencido(s);
    aviso.innerHTML = vencido
        ? `<p><b>Tienes la solicitud #${s.id} pendiente de entrega.</b></p>
           <p>Pasaron más de ${HORAS_PARA_AGREGAR} horas desde que la hiciste, así que ya no puedes agregarle materiales.
              Debes entregarla para volver a solicitar.</p>
           <a href="entregar.html" class="btn">Ir a entregar materiales</a>`
        : `<p><b>Tienes la solicitud #${s.id} pendiente de entrega.</b></p>
           <p>No puedes hacer una solicitud nueva hasta entregarla, pero puedes agregarle lo que te falte
              <b>hasta las ${horaCorta(limiteParaAgregar(s))}</b>.</p>
           <p><a href="entregar.html">Ir a entregar materiales</a></p>`;
    if (vencido) {
        // Plazo vencido: solo se muestra lo pedido y el acceso a entregar
        document.getElementById("formMateriales").hidden = true;
    }

    const { data: existentes } = await supabaseClient
        .from("materiales_solicitados")
        .select("material, cantidad")
        .eq("id_solicitud", s.id);
    if (existentes && existentes.length) {
        document.getElementById("listaYaSolicitados").innerHTML = existentes
            .map(m => `<li><span>${m.material}</span><span class="num muted">× ${m.cantidad}</span></li>`).join("");
        document.getElementById("yaSolicitados").hidden = false;
    }

    document.getElementById("tituloMateriales").textContent = "Materiales a agregar";
    document.querySelector(".btnRemove").textContent = "Quitar fila";
    document.querySelector(".btnEnviar").innerText = textoBotonEnviar();
}

async function enviar() {
    const btn = document.querySelector(".btnEnviar");
    btn.disabled = true;
    btn.innerText = "Enviando...";

    const docente = document.getElementById("docente").value;
    const asignatura = document.getElementById("asignatura").value.trim();
    const filas = document.querySelectorAll("#tbody tr");
    const materiales = [];

    // 1. OBTENER EL ID DEL USUARIO
    const user = JSON.parse(localStorage.getItem("currentUser"));
    if (!user || !user.id) return finishError("Error de usuario: El ID de usuario no está disponible.");
    const userId = user.id; // Asumimos que 'user.id' contiene el ID de la tabla 'usuarios'

    if (!docente) return finishError("Seleccione un docente.");
    if (!asignatura) return finishError("Ingrese la asignatura.");
    // ... (El resto de la validación de materiales sigue igual)
    
    filas.forEach(f => {
        const inputMaterial = f.querySelector("input[type=text]");
        const inputCantidad = f.querySelector("input[type=number]");
        
        const nombre = inputMaterial ? inputMaterial.value.trim() : "";
        const cantidad = inputCantidad ? parseInt(inputCantidad.value.trim(), 10) : 0;
        
        if (nombre && cantidad && cantidad > 0) materiales.push({ material: nombre, cantidad });
    });

    if (materiales.length === 0) return finishError("Debe ingresar al menos un material válido.");

    // Revisar de nuevo justo antes de guardar, por si la solicitud pendiente
    // se entregó o se creó otra desde otro dispositivo mientras la página estaba abierta.
    const pendienteActual = await buscarPendiente();
    if ((pendienteActual?.id ?? null) !== (solicitudPendiente?.id ?? null)) {
        alert(pendienteActual
            ? `Tienes la solicitud #${pendienteActual.id} pendiente. La página se actualizará para que agregues los materiales a esa solicitud.`
            : "Tu solicitud pendiente ya fue entregada. La página se actualizará para que hagas una solicitud nueva.");
        window.location.reload();
        return;
    }

    if (solicitudPendiente && plazoVencido(solicitudPendiente)) {
        alert(`Pasaron más de ${HORAS_PARA_AGREGAR} horas desde la solicitud #${solicitudPendiente.id}. Debes entregarla para volver a solicitar.`);
        window.location.reload();
        return;
    }

    if (solicitudPendiente) {
        try {
            for (const m of materiales) {
                const { error: materialError } = await supabaseClient
                    .from("materiales_solicitados")
                    .insert([{ id_solicitud: solicitudPendiente.id, material: m.material, cantidad: m.cantidad }]);
                if (materialError) throw materialError;
            }
            alert(`✅ Materiales agregados a la solicitud #${solicitudPendiente.id}.`);
            window.location.href = "menu.html";
        } catch (err) {
            console.error(err);
            finishError("Error al agregar: " + err.message);
        }
        return;
    }

    try {
        /* 1️⃣ Insertar solicitud */
        const { data: solicitud, error } = await supabaseClient
            .from("solicitudes")
            .insert([{
                email: user.email,
                docente,
                asignatura,
                fecha_solicitud: new Date().toISOString(),
                estado: "Pendiente",
                
                // 🔑 ¡LÍNEA CORREGIDA Y CLAVE!
                id_usuario: userId 
            }])
            .select()
            .single();

        if (error) throw error;

        /* 2️⃣ Insertar materiales */
        // ... (El resto del código de inserción de materiales sigue igual)
        for (const m of materiales) {
            const { error: materialError } = await supabaseClient
                .from("materiales_solicitados")
                .insert([{ id_solicitud: solicitud.id, material: m.material, cantidad: m.cantidad }]);
            if (materialError) throw materialError;
        }

        alert("✅ Solicitud enviada con éxito.");
        window.location.href = "menu.html";

    } catch (err) {
        console.error(err);
        finishError("Error al enviar: " + err.message);
    }
}
function finishError(msg) {
    alert("❌ " + msg);
    const btn = document.querySelector(".btnEnviar");
    btn.disabled = false;
    btn.innerText = textoBotonEnviar();
}

/* -------------------------------------------------------------------
    CARGAR DATOS CUANDO VIENE DESDE "REPETIR SOLICITUD"
------------------------------------------------------------------- */
document.addEventListener("DOMContentLoaded", () => {
    // Activar autocompletado para el campo de asignatura
    const inputAsignatura = document.getElementById("asignatura");
    if (inputAsignatura) {
        enableAutocomplete(inputAsignatura, asignaturasLista);
    }

    // Activar autocompletado en todos los inputs de material existentes
    document.querySelectorAll("#tbody input[type=text]").forEach(input => {
        enableAutocomplete(input, materialesLista);
    });

    // Cargar datos si viene desde "Repetir Solicitud"
    const params = new URLSearchParams(window.location.search);
    const docente = params.get("docente");
    const asignatura = params.get("asignatura");
    const materiales = JSON.parse(params.get("materiales") || "[]");
    const cantidades = JSON.parse(params.get("cantidades") || "[]");

    if (docente) document.getElementById("docente").value = docente;
    if (asignatura) document.getElementById("asignatura").value = asignatura;

    const tbody = document.getElementById("tbody");
    if (materiales.length > 0) {
        tbody.innerHTML = "";
        for (let i = 0; i < materiales.length; i++) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>
                    <div class="autocomplete-wrapper">
                        <input type="text" value="${materiales[i]}" />
                    </div>
                </td>
                <td><input type="number" min="1" value="${cantidades[i] || 1}" /></td>
            `;
            tbody.appendChild(tr);
            
            // Activar autocompletado para cada input de material cargado
            const inputMaterial = tr.querySelector("input[type=text]");
            enableAutocomplete(inputMaterial, materialesLista);
        }
    }

    activarModoAgregar();
});
