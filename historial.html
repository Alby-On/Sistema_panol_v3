<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Mi historial | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-30d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-30d"></script>
</head>
<body data-modulo="historial">
<header class="appbar">
    <div class="appbar-inner">
        <a href="menu.html" class="appbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Menú</a>
        <div class="appbar-title"><h1>Mi historial</h1><p>Pañol Electricidad y Automatización</p></div>
        
    </div>
</header>
<main class="page historial">
    <section class="hist-resumen" id="resumen" hidden>
        <div class="hist-stat"><p class="hist-num num" id="resTotal">0</p><p class="hist-lbl">solicitudes entregadas</p></div>
        <div class="hist-stat"><p class="hist-num num" id="resUnidades">0</p><p class="hist-lbl">unidades prestadas</p></div>
        <div class="hist-stat hist-stat-wide"><p class="hist-num hist-txt" id="resMaterial">–</p><p class="hist-lbl">tu material más pedido</p></div>
    </section>

    <div class="hist-toolbar">
        <input type="search" id="buscador" placeholder="Buscar por asignatura, docente o material" autocomplete="off" aria-label="Buscar en mi historial">
        <div class="segmented hist-periodo" role="group" aria-label="Periodo">
            <button type="button" class="is-active" data-periodo="todo">Todo</button>
            <button type="button" data-periodo="30">30 días</button>
            <button type="button" data-periodo="180">6 meses</button>
            <button type="button" data-periodo="fechas">Fechas</button>
        </div>
        <div class="filter-box hist-fechas" id="cajaFechas" hidden>
            <div class="filter-field"><label for="desde">Desde</label><input type="date" id="desde"></div>
            <div class="filter-field"><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
        </div>
    </div>

    <p class="muted hist-conteo" id="conteo" aria-live="polite">Cargando tu historial…</p>
    <div id="cards-historial"></div>
    <button type="button" class="btn-secondary" id="btnMas" hidden>Mostrar más</button>
    <div id="sin-datos" class="empty-state" hidden></div>
</main>

<script>
/* ==========================================================
   MI HISTORIAL
   - Una sola consulta trae las solicitudes con sus materiales
     (antes se hacía una consulta extra por cada solicitud).
   - Búsqueda y filtros de periodo sin volver a consultar.
   - Agrupado por mes, 10 solicitudes a la vez.
========================================================== */
const POR_PAGINA = 10;
let historial = [];          // todas las solicitudes entregadas del usuario
let visibles = POR_PAGINA;
let periodo = "todo";

const escapar = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nombrePropio = (t) => String(t ?? "").toLocaleLowerCase("es-CL").replace(/(^|[\s-])(\p{L})/gu, (m, s, l) => s + l.toLocaleUpperCase("es-CL"));
const fmtNum = (n) => Number(n).toLocaleString("es-CL");
const fmtFecha = (d) => d ? d.toLocaleDateString("es-CL", { day: "numeric", month: "short", year: "numeric" }) : "–";
const fmtHora = (d) => d ? d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }) : "";

document.addEventListener("DOMContentLoaded", async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        alert("Debes iniciar sesión.");
        window.location.href = "index.html";
        return;
    }
    await cargarHistorial(session.user.email);
});

async function cargarHistorial(email) {
    const filas = [];
    try {
        for (let desde = 0; ; desde += 1000) {
            const { data, error } = await supabaseClient
                .from("solicitudes")
                .select("id, docente, asignatura, fecha_solicitud, fecha_entrega, materiales_solicitados (material, cantidad)")
                .eq("email", email)
                .eq("estado", "Entregado")
                .order("fecha_entrega", { ascending: false })
                .range(desde, desde + 999);
            if (error) throw error;
            filas.push(...(data || []));
            if (!data || data.length < 1000) break;
        }
    } catch (err) {
        console.error(err);
        document.getElementById("conteo").textContent = "";
        mostrarVacio("No se pudo cargar tu historial. Revisa tu conexión e intenta de nuevo.");
        return;
    }
    historial = filas.map(s => ({
        ...s,
        _solicitud: fechaSupabase(s.fecha_solicitud),
        _entrega: fechaSupabase(s.fecha_entrega),
        _materiales: s.materiales_solicitados || []
    }));
    resumen();
    renderizar();
}

function resumen() {
    if (!historial.length) return;
    const unidades = historial.reduce((t, s) => t + s._materiales.reduce((u, m) => u + (Number(m.cantidad) || 0), 0), 0);
    const veces = {};
    historial.forEach(s => s._materiales.forEach(m => {
        const k = (m.material || "").trim();
        if (k) veces[k] = (veces[k] || 0) + 1;
    }));
    const top = Object.entries(veces).sort((a, b) => b[1] - a[1])[0];
    document.getElementById("resTotal").textContent = fmtNum(historial.length);
    document.getElementById("resUnidades").textContent = fmtNum(unidades);
    document.getElementById("resMaterial").textContent = top ? top[0] : "–";
    document.getElementById("resMaterial").title = top ? `${top[0]} (${top[1]} veces)` : "";
    document.getElementById("resumen").hidden = false;
}

function filtradas() {
    const q = document.getElementById("buscador").value.trim().toLowerCase();
    let desde = null, hasta = null;
    if (periodo === "30" || periodo === "180") {
        desde = new Date(Date.now() - Number(periodo) * 864e5);
    } else if (periodo === "fechas") {
        const d = document.getElementById("desde").value, h = document.getElementById("hasta").value;
        if (d) desde = new Date(d + "T00:00:00");
        if (h) hasta = new Date(h + "T23:59:59.999");
    }
    return historial.filter(s => {
        const f = s._entrega || s._solicitud;
        if (desde && f < desde) return false;
        if (hasta && f > hasta) return false;
        if (!q) return true;
        const texto = [s.id, s.docente, s.asignatura, ...s._materiales.map(m => m.material)].join(" ").toLowerCase();
        return q.split(/\s+/).every(p => texto.includes(p));
    });
}

function tarjeta(s) {
    const mats = s._materiales;
    const lista = mats.length
        ? mats.map(m => `<li><span>${escapar(m.material)}</span><span class="num">× ${escapar(m.cantidad)}</span></li>`).join("")
        : '<li class="muted">Sin materiales registrados.</li>';
    return `
    <article class="hist-card">
        <div class="hist-card-top">
            <h3 class="num">Solicitud #${s.id}</h3>
            <span class="chip chip-done">Entregada</span>
        </div>
        <p class="hist-asig">${escapar(s.asignatura)}</p>
        <p class="hist-doc">${escapar(nombrePropio(s.docente))}</p>
        <dl class="hist-fechas-dl">
            <dt>Solicitada</dt><dd class="num">${fmtFecha(s._solicitud)} ${fmtHora(s._solicitud)}</dd>
            <dt>Entregada</dt><dd class="num">${fmtFecha(s._entrega)} ${fmtHora(s._entrega)}</dd>
        </dl>
        <details class="rc-materiales">
            <summary>${mats.length} ${mats.length === 1 ? "material" : "materiales"}</summary>
            <ul>${lista}</ul>
        </details>
        <button type="button" class="btn-secondary btn-repetir" onclick="repetirSolicitud(${s.id})">Repetir esta solicitud</button>
    </article>`;
}

function renderizar() {
    const lista = filtradas();
    const cont = document.getElementById("cards-historial");
    const conteo = document.getElementById("conteo");
    const btnMas = document.getElementById("btnMas");

    if (!historial.length) {
        conteo.textContent = "";
        cont.innerHTML = "";
        btnMas.hidden = true;
        mostrarVacio('Aún no tienes solicitudes entregadas. Cuando completes una entrega aparecerá aquí. <a href="solicitar.html">Hacer una solicitud</a>');
        return;
    }
    if (!lista.length) {
        conteo.textContent = "";
        cont.innerHTML = "";
        btnMas.hidden = true;
        mostrarVacio("Ninguna solicitud coincide con la búsqueda o el periodo elegido.");
        return;
    }
    document.getElementById("sin-datos").hidden = true;

    const pagina = lista.slice(0, visibles);
    conteo.textContent = lista.length === historial.length
        ? `${fmtNum(lista.length)} solicitudes`
        : `${fmtNum(lista.length)} de ${fmtNum(historial.length)} solicitudes`;

    // Agrupar por mes de entrega
    const grupos = [];
    pagina.forEach(s => {
        const f = s._entrega || s._solicitud;
        const clave = f ? `${f.getFullYear()}-${f.getMonth()}` : "sin-fecha";
        let g = grupos[grupos.length - 1];
        if (!g || g.clave !== clave) {
            const nombre = f ? f.toLocaleDateString("es-CL", { month: "long", year: "numeric" }) : "Sin fecha";
            g = { clave, nombre: nombre.charAt(0).toUpperCase() + nombre.slice(1), items: [] };
            grupos.push(g);
        }
        g.items.push(s);
    });
    cont.innerHTML = grupos.map(g => `
        <section class="hist-mes">
            <h2 class="hist-mes-titulo">${escapar(g.nombre)}</h2>
            <div class="hist-grid">${g.items.map(tarjeta).join("")}</div>
        </section>`).join("");

    const faltan = lista.length - pagina.length;
    btnMas.hidden = faltan <= 0;
    btnMas.textContent = `Mostrar ${Math.min(POR_PAGINA, faltan)} más (quedan ${fmtNum(faltan)})`;
}

function mostrarVacio(html) {
    const el = document.getElementById("sin-datos");
    el.innerHTML = html;
    el.hidden = false;
}

/* ------------------ Repetir solicitud (sin consultas extra) ------------------ */
function repetirSolicitud(id) {
    const s = historial.find(x => x.id === id);
    if (!s) return;
    const params = new URLSearchParams({
        docente: s.docente,
        asignatura: s.asignatura,
        materiales: JSON.stringify(s._materiales.map(m => m.material)),
        cantidades: JSON.stringify(s._materiales.map(m => m.cantidad))
    });
    window.location.href = `solicitar.html?${params.toString()}`;
}

/* ------------------ Filtros ------------------ */
document.getElementById("buscador").addEventListener("input", () => { visibles = POR_PAGINA; renderizar(); });
document.querySelectorAll(".hist-periodo [data-periodo]").forEach(b => b.addEventListener("click", () => {
    periodo = b.dataset.periodo;
    document.querySelectorAll(".hist-periodo [data-periodo]").forEach(x => x.classList.toggle("is-active", x === b));
    document.getElementById("cajaFechas").hidden = periodo !== "fechas";
    visibles = POR_PAGINA;
    renderizar();
}));
["desde", "hasta"].forEach(id => document.getElementById(id).addEventListener("change", () => { visibles = POR_PAGINA; renderizar(); }));
document.getElementById("btnMas").addEventListener("click", () => { visibles += POR_PAGINA; renderizar(); });
</script>
</body>
</html>
