<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Nueva contraseña | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-30d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-30d"></script>
</head>
<body data-modulo="inicio">
<header class="appbar">
    <div class="appbar-inner">
        
        <div class="appbar-title"><h1>Nueva contraseña</h1><p>Pañol Electricidad y Automatización</p></div>
        
    </div>
</header>
<main class="page">
    <section class="panel container">
        <h2>Crea tu nueva contraseña</h2>
        <p class="muted">Debe tener al menos 8 caracteres.</p>
        <form onsubmit="event.preventDefault(); cambiarPassword();">
            <label for="nuevaPass">Nueva contraseña</label>
            <div class="password-container">
                <input type="password" id="nuevaPass" placeholder="Mínimo 8 caracteres" onkeyup="checkPasswordMatch()" required minlength="8" autocomplete="new-password"/>
                <span class="toggle-password" onclick="toggleVisibility('nuevaPass', this)" role="button" aria-label="Mostrar contraseña">👁️</span>
            </div>
            <label for="confirmarPass">Confirma la contraseña</label>
            <div class="password-container">
                <input type="password" id="confirmarPass" placeholder="Repite la contraseña" onkeyup="checkPasswordMatch()" required minlength="8" autocomplete="new-password"/>
                <span class="toggle-password" onclick="toggleVisibility('confirmarPass', this)" role="button" aria-label="Mostrar contraseña">👁️</span>
            </div>
            <div class="message-spacer"><p id="password-match-message"></p></div>
            <button id="btnActualizar" type="submit" disabled>Guardar contraseña</button>
        </form>
        <button class="btn-secondary" id="btnLogin" onclick="irLogin()" disabled>Ir a iniciar sesión</button>
        <p id="msg"></p>
    </section>
</main>
<script>


function showMessage(text, isError = false) {
    const msg = document.getElementById("msg");
    msg.textContent = isError ? "❌ " + text : "✅ " + text;
    msg.className = isError ? "msg-error" : "msg-success";
}

async function init() {
    const hash = window.location.hash;

    if (!hash) {
        showMessage("No se detectó enlace válido.", true);
        return;
    }

    const params = new URLSearchParams(hash.slice(1));
    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");

    if (!access_token || !refresh_token) {
        showMessage("El enlace es inválido o expiró.", true);
        return;
    }

    const { error } = await supabaseClient.auth.setSession({ access_token, refresh_token });
    if (error) {
        showMessage("Error al iniciar sesión desde el enlace.", true);
        return;
    }
}

init();

async function cambiarPassword() {
    // ⬇️ Obtener el valor del campo principal
    const nuevaPass = document.getElementById("nuevaPass").value; 
    const btnLogin = document.getElementById("btnLogin");
    const btnActualizar = document.getElementById("btnActualizar"); // Lo usamos para deshabilitarlo

    // Ya no es necesario validar campo vacío aquí si usamos checkPasswordMatch
    // pero mantenemos la validación de la función por seguridad.
    if (!nuevaPass) {
        showMessage("Ingresa una nueva contraseña.", true);
        return;
    }
    
    // 🚫 Impedir el envío si el botón está habilitado por error o manipulación
    if (btnActualizar.disabled) {
        showMessage("Las contraseñas no cumplen los requisitos.", true);
        return;
    }

    // Deshabilitar botón durante el proceso
    btnActualizar.disabled = true; 

    const { error } = await supabaseClient.auth.updateUser({ password: nuevaPass });
    
    if (error) {
        showMessage("Error al actualizar contraseña: " + error.message, true);
        btnActualizar.disabled = false; // Re-habilitar si falla
        return;
    }

    showMessage("Contraseña actualizada correctamente.");
    btnLogin.disabled = false; // 🔹 Habilita el botón de Volver al Login
}

function irLogin() {
    window.location.href = "index.html";
}
// ----------------------------------------
// FUNCIONES DE UTILIDAD PARA CONTRASEÑA
// ----------------------------------------

/**
 * Alterna la visibilidad de un campo de contraseña.
 */
function toggleVisibility(fieldId, toggleElement) {
    const field = document.getElementById(fieldId);
    
    if (field.type === "password") {
        field.type = "text";
        toggleElement.textContent = "🔒"; // Icono de cerrado (visible)
    } else {
        field.type = "password";
        toggleElement.textContent = "👁️"; // Icono de abierto (oculto)
    }
}

/**
 * Verifica si las dos contraseñas coinciden.
 */
function checkPasswordMatch() {
    const pass = document.getElementById("nuevaPass");
    const confirmPass = document.getElementById("confirmarPass");
    const messageElement = document.getElementById("password-match-message");
    const btnActualizar = document.getElementById("btnActualizar");

    const passValue = pass.value.trim();
    const confirmValue = confirmPass.value.trim();

    // Limpiar clases y mensajes
    messageElement.textContent = "";
    pass.classList.remove("password-mismatch");
    confirmPass.classList.remove("password-mismatch");
    btnActualizar.disabled = true; // Deshabilitar por defecto hasta la validación

    // Mínimo de 6 caracteres (recomendación de Supabase)
    if (passValue.length > 0 && passValue.length < 6) {
        messageElement.textContent = "❌ La contraseña debe tener al menos 6 caracteres.";
        messageElement.style.color = "var(--color-danger)";
        pass.classList.add("password-mismatch");
        return false;
    }

    if (confirmValue.length > 0) {
        if (passValue !== confirmValue) {
            // No coinciden
            messageElement.textContent = "❌ Las contraseñas no coinciden.";
            messageElement.style.color = "var(--color-danger)";
            pass.classList.add("password-mismatch");
            confirmPass.classList.add("password-mismatch");
            return false;
        } else if (passValue.length >= 6) {
            // Coinciden y cumplen el mínimo
            messageElement.textContent = "✅ Contraseñas coinciden.";
            messageElement.style.color = "var(--color-success)";
            btnActualizar.disabled = false; // HABILITAR EL BOTÓN
            return true;
        }
    }
    return false; // No cumplen los criterios para habilitar el botón
}
</script>
</body>
</html>
