<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Menú | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-30d">

</head>
<body data-modulo="inicio">
<header class="appbar">
    <div class="appbar-inner">
        
        <div class="appbar-title"><h1>Sistema de Pañol</h1><p>Pañol Electricidad y Automatización</p></div>
        <button class="btn-sm btn-text logout appbar-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</header>
<main class="page">
    <div class="page-intro">
        <h2 id="welcomeMsg" class="welcome"></h2>
        <p>¿Qué necesitas hacer hoy?</p>
    </div>

    <div class="menu-list">
        <button id="btnSolicitar" onclick="location.href='solicitar.html'" data-color="azul"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11v6M9 14h6"/></svg></span><span class="item-title">Solicitar materiales</span><span class="item-desc">Pide herramientas e insumos para tu clase</span></button>
        <button id="btnEntregar" onclick="location.href='entregar.html'" data-color="verde"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span><span class="item-title">Entregar materiales</span><span class="item-desc">Completa la entrega de tus solicitudes pendientes</span></button>
        <button onclick="location.href='historial.html'" data-color="violeta"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></span><span class="item-title">Mi historial</span><span class="item-desc">Revisa y repite solicitudes anteriores</span></button>
    </div>

    <div class="menu-group" id="adminGroup" hidden>
        <h3>Administración</h3>
        <div class="menu-list">
            <button id="admin_panel_Button" onclick="location.href='panel_admin.html'" data-color="ambar"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></span><span class="item-title">Gestor de solicitudes</span><span class="item-desc">Entregas pendientes y comentarios</span></button>
            <button id="admin_estadisticas_Button" onclick="location.href='panel_estadisticas.html'" data-color="teal"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><rect x="5" y="11" width="3" height="7" rx="1"/><rect x="10.5" y="5" width="3" height="13" rx="1"/><rect x="16" y="14" width="3" height="4" rx="1"/></svg></span><span class="item-title">Estadísticas</span><span class="item-desc">Uso del pañol por docente, carrera y material</span></button>
            <button id="admin_docentes_Button" onclick="location.href='panel_docentes.html'" data-color="indigo"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5-10-5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg></span><span class="item-title">Docentes</span><span class="item-desc">Solicitudes y equipos más pedidos por docente</span></button>
            <button id="admin_historial_Button" onclick="location.href='historial_admin.html'" data-color="coral"><span class="item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><span class="item-title">Histórico de solicitudes</span><span class="item-desc">Busca solicitudes entregadas por RUT o fecha</span></button>
        </div>
    </div>

    <div class="menu-group">
        <h3>Mi perfil</h3>
        <div class="panel">
            <dl class="profile">
                <dt>Nombre</dt><dd id="pNombre"></dd>
                <dt>RUT</dt><dd id="pRut" class="num"></dd>
                <dt>Carrera</dt><dd id="pCarrera"></dd>
                <dt>Teléfono</dt><dd id="pTelefono" class="num"></dd>
                <dt>Correo</dt><dd id="pCorreo"></dd>
            </dl>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-30d"></script>
<script type="module">
/* ---------------------- SESIÓN ACTIVA ---------------------- */
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
    window.location.href = "index.html";
}

/* ---------------------- DATOS EN PANTALLA ---------------------- */
document.getElementById("welcomeMsg").textContent = `Hola, ${user.nombre.split(' ')[0]}`; // Mostrar solo el primer nombre
document.getElementById("pNombre").textContent   = user.nombre;
document.getElementById("pRut").textContent      = user.rut;
document.getElementById("pCarrera").textContent  = user.carrera;
document.getElementById("pTelefono").textContent = user.telefono;
document.getElementById("pCorreo").textContent   = user.email;

/* ---------------------- CERRAR SESIÓN ---------------------- */
function logout() {
    localStorage.removeItem("currentUser");
    window.location.href = "index.html";
}

/* ---- Necesario para que el botón funcione ---- */
window.logout = logout;

// Si el alumno tiene una solicitud pendiente, el menú lo indica:
// solo podrá agregar materiales a esa solicitud hasta entregarla.
async function revisarPendiente() {
    if (user.rol === "admin" || typeof supabaseClient === "undefined") return;
    const { data } = await supabaseClient
        .from("solicitudes")
        .select("id, fecha_solicitud")
        .eq("email", user.email)
        .eq("estado", "Pendiente")
        .order("fecha_solicitud", { ascending: false })
        .limit(1);
    const pendiente = data && data[0];
    if (!pendiente) return;
    const sol = document.getElementById("btnSolicitar");
    const limite = fechaSupabase(pendiente.fecha_solicitud).getTime() + 2 * 36e5;   // 2 horas para agregar
    if (Date.now() < limite) {
        const hora = new Date(limite).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
        sol.querySelector(".item-title").textContent = `Agregar a mi solicitud #${pendiente.id}`;
        sol.querySelector(".item-desc").textContent = `Puedes agregar lo que te falte hasta las ${hora}`;
    } else {
        sol.classList.add("is-locked");
        sol.querySelector(".item-desc").textContent = "Bloqueado hasta que entregues tu solicitud pendiente";
    }
    const ent = document.getElementById("btnEntregar");
    ent.classList.add("is-pending");
    ent.querySelector(".item-desc").textContent = `Entrega la solicitud #${pendiente.id} para poder hacer una nueva`;
}
revisarPendiente();

// Mostrar la sección de administración solo a administradores
if (user.rol === "admin") {
    document.getElementById("adminGroup").hidden = false;
}
</script>
</body>
</html>
