<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Entregar materiales | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-30d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-30d"></script>
</head>
<body data-modulo="entregar">
<header class="appbar">
    <div class="appbar-inner">
        <a href="menu.html" class="appbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Menú</a>
        <div class="appbar-title"><h1>Entregar materiales</h1><p>Pañol Electricidad y Automatización</p></div>
        
    </div>
</header>
<main class="page container">
    <div class="page-intro">
        <h2>Solicitudes pendientes</h2>
        <p>Marca cada material para completar la entrega.</p>
    </div>
    <div id="solicitudes-container"><p class="muted">Cargando…</p></div>
</main>
<script>
/* --- LÓGICA ORIGINAL SIN MODIFICAR FUNCIONALIDADES --- */




/* Tiempo mínimo entre la solicitud y la entrega */
const MINUTOS_ESPERA = 5;
let temporizadores = [];

/* INIT */
async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        alert("Debes iniciar sesión.");
        window.location.href = "index.html";
        return;
    }

    cargarSolicitudes(session.user.email);
}

/* CARGAR SOLICITUDES */
async function cargarSolicitudes(email) {
    const { data: solicitudes, error } = await supabaseClient
        .from('solicitudes')
        .select('*')
        .eq('email', email)
        .eq('estado', 'Pendiente');

    const container = document.getElementById('solicitudes-container');
    container.innerHTML = "";

    if (!solicitudes || solicitudes.length === 0) {
        container.innerHTML = `<div class="empty-state">No tienes solicitudes pendientes de entrega.</div>`;
        return;
    }

    temporizadores.forEach(clearInterval);
    temporizadores = [];

    for (const solicitud of solicitudes) {

        const { data: materiales } = await supabaseClient
            .from('materiales_solicitados')
            .select('*')
            .eq('id_solicitud', solicitud.id);

        
        const box = document.createElement("div");
        box.classList.add("solicitud-box");

        box.innerHTML = `
            <div class="card-header"><strong>Solicitud #${solicitud.id}</strong><span class="chip ${solicitud.estado === "Pendiente" ? "chip-pending" : "chip-done"}">${solicitud.estado}</span></div>
            <dl class="profile">
                <dt>Docente</dt><dd>${solicitud.docente}</dd>
                <dt>Asignatura</dt><dd>${solicitud.asignatura}</dd>
                <dt>Fecha</dt><dd class="num">${fechaSupabase(solicitud.fecha_solicitud).toLocaleDateString()}</dd>
            </dl>

            <div class="section-title">Materiales solicitados</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Material</th><th>Cantidad</th><th>Entregado</th></tr>
                    </thead>
                    <tbody>
                        ${materiales.map(m => `
                            <tr>
                                <td>${m.material}</td>
                                <td>${m.cantidad}</td>
                                <td class="check-col"><input type="checkbox" class="chk"></td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>

            <div class="espera-entrega" hidden></div>

            <div class="mensaje-error">
                Marca todos los materiales para completar la entrega.
            </div>

            <button class="btn-entregar btn-success">Completar entrega</button>
        `;

        container.appendChild(box);

        const checks = box.querySelectorAll(".chk");
        const msg = box.querySelector(".mensaje-error");
        const btn = box.querySelector(".btn-entregar");
        const espera = box.querySelector(".espera-entrega");
        const disponibleDesde = fechaSupabase(solicitud.fecha_solicitud).getTime() + MINUTOS_ESPERA * 60000;
        const enEspera = () => Date.now() < disponibleDesde;

        function validar() {
            // Durante los primeros minutos no se puede marcar ni completar la entrega
            if (enEspera()) {
                const seg = Math.ceil((disponibleDesde - Date.now()) / 1000);
                const mmss = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}`;
                espera.hidden = false;
                espera.innerHTML = `Podrás completar la entrega en <strong class="num">${mmss}</strong>. La solicitud se hizo hace menos de ${MINUTOS_ESPERA} minutos.`;
                checks.forEach(c => { c.disabled = true; c.checked = false; });
                msg.style.display = "none";
                btn.disabled = true;
                btn.style.opacity = "0.5";
                btn.style.cursor = "not-allowed";
                return;
            }
            espera.hidden = true;
            checks.forEach(c => { c.disabled = false; });
            btn.disabled = false;

            const completo = [...checks].every(c => c.checked);

            if (completo) {
                msg.style.display = "none";
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
            } else {
                msg.style.display = "block";
                btn.style.opacity = "0.5";
                btn.style.cursor = "not-allowed";
            }
        }

        checks.forEach(c => c.addEventListener("change", validar));

        btn.addEventListener("click", async () => {
            if (enEspera() || ![...checks].every(c => c.checked)) return;

            const { error: upErr } = await supabaseClient
                .from("solicitudes")
                .update({
                    estado: "Entregado",
                    fecha_entrega: new Date().toISOString()
                })
                .eq("id", solicitud.id);

            if (upErr) return alert("Error: " + upErr.message);

            alert("✔ Entrega registrada correctamente.");
            cargarSolicitudes(email);
        });

        validar();

        // Actualiza la cuenta regresiva cada segundo hasta que se habilite la entrega
        if (enEspera()) {
            const t = setInterval(() => {
                validar();
                if (!enEspera()) clearInterval(t);
            }, 1000);
            temporizadores.push(t);
        }
    }
}

init();
</script>
</body>
</html>
