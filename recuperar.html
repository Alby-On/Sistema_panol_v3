<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Recuperar contraseña | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-30d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-30d"></script>
</head>
<body data-modulo="inicio">
<header class="appbar">
    <div class="appbar-inner">
        <a href="index.html" class="appbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Inicio</a>
        <div class="appbar-title"><h1>Recuperar contraseña</h1><p>Pañol Electricidad y Automatización</p></div>
        
    </div>
</header>
<main class="page">
    <section class="panel container">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p class="muted">Escribe el correo con que te registraste y te enviaremos un enlace para crear una nueva.</p>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@inacapmail.cl" autocomplete="email">
        <button onclick="enviarCorreo()">Enviar enlace</button>
        <p id="msg"></p>
    </section>
</main>
<script>


async function enviarCorreo() {
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("msg");
    
    // Limpiar clases anteriores
    msg.textContent = "";
    msg.className = "";


    if (!email) {
        msg.textContent = "⚠️ Ingresa tu correo electrónico.";
        msg.classList.add("msg-error");
        return;
    }

    // 🔥 Método correcto para enviar enlace de reset password
    const { data, error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
            emailRedirectTo: new URL("reset.html", window.location.href).href, // misma carpeta donde está publicada esta versión
            shouldCreateUser: false,
            flowType: "recovery"    // 🔥 Clave para reset password
        }
    });

    if (error) {
        msg.textContent = "❌ Error: " + error.message;
        msg.classList.add("msg-error");
        return;
    }

    msg.classList.add("msg-success");
    msg.textContent = "✅ Correo enviado correctamente. Revisa tu bandeja de entrada o spam para continuar.";
}
</script>
</body>
</html>
