<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Histórico de solicitudes | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-30d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-30d"></script>
</head>
<body data-modulo="historico">
<header class="appbar">
    <div class="appbar-inner">
        <a href="menu.html" class="appbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Menú</a>
        <div class="appbar-title"><h1>Histórico de solicitudes</h1><p>Pañol Electricidad y Automatización</p></div>
        
    </div>
</header>
<main class="page page-wide main-content">
    <div class="filter-box has-3">
        <div class="filter-field"><label for="filtro-rut">RUT del solicitante</label><input type="text" id="filtro-rut" placeholder="12345678-5"></div>
        <div class="filter-field"><label for="desde">Desde</label><input type="date" id="desde"></div>
        <div class="filter-field"><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
        <button id="btn-buscar">Buscar</button>
    </div>
    <div class="tabla-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>RUT</th>
                    <th>Docente</th>
                    <th>Asignatura</th>
                    <th>Correo</th>
                    <th>Entrega</th>
                    <th>Materiales</th>
                </tr>
            </thead>
            <tbody id="tabla-historial"></tbody>
        </table>
    </div>
    <div id="sin-datos" class="empty-state" style="display:none; margin-top:16px;">No se encontraron solicitudes con esos filtros.</div>
</main>

<div class="modal" id="modal-materiales">
    <div class="modal-content">
        <div class="modal-header"><span class="title">Materiales solicitados</span><span class="close-btn" onclick="cerrarModal()" role="button" aria-label="Cerrar">×</span></div>
        <div class="modal-body">
            <div class="tabla-wrapper">
                <table>
                    <thead><tr><th>Material</th><th style="width: 30%;">Cantidad</th></tr></thead>
                    <tbody id="modal-body-materiales"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
/* ---------------------- CLIENTE SUPABASE ---------------------- */


document.addEventListener("DOMContentLoaded", async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        alert("Debes iniciar sesión.");
        window.location.href = "index.html";
        return;
    }
    cargarHistorial();
});

/* ---------------------- FUNCIÓN AUXILIAR DE LIMPIEZA DE RUT ---------------------- */
/**
 * Limpia el formato del RUT (elimina puntos y guiones).
 * IMPORTANTE: Convierte a MINÚSCULAS para la comparación local, 
 * ya que tu BBDD guarda la 'k' en minúscula.
 */
function limpiarRut(rut_input) {
    if (!rut_input) return '';
    return rut_input.replace(/\./g, '').replace(/-/g, '').toLowerCase().trim();
}


/* ---------------------- CARGAR HISTORIAL (FILTRADO 100% EN JAVASCRIPT) ---------------------- */
async function cargarHistorial(filtros = {}) {
    const { desde, hasta, rut } = filtros;
    
    // 1. Consulta Inicial (trae TODOS los datos entregados + el RUT por LEFT JOIN)
    let query = supabaseClient
        .from('solicitudes')
        // Usamos LEFT JOIN para que traiga la solicitud aunque el id_usuario sea NULL
        .select('*, usuarios!left(rut)')
        .eq('estado', 'Entregado')
        .order('fecha_entrega', { ascending: false });

    // NOTA: Los filtros de fecha se aplicarán en el servidor, ya que son eficientes.
    if (desde) query = query.gte('fecha_entrega', desde);
    if (hasta) query = query.lte('fecha_entrega', hasta + 'T23:59:59.999Z');

    const { data: solicitudesRaw, error } = await query;

    let solicitudes = solicitudesRaw || [];

    // 2. FILTRADO DE RUT EN JAVASCRIPT (SOLO SI SE PROPORCIONÓ RUT)
    if (rut) {
        // Obtenemos el RUT limpio para buscar (ya está en minúsculas por limpiarRut)
        const rutBuscadoLimpio = limpiarRut(rut); 

        solicitudes = solicitudes.filter(s => {
            // Extraemos el RUT de la solicitud si existe, y lo limpiamos/minusculizamos para comparar
            const rutSolicitante = s.usuarios ? limpiarRut(s.usuarios.rut) : '';
            
            // Comparamos: solo si el RUT del solicitante CONTIENE el RUT buscado
            // (Usamos .includes() para simular el ILIKE con comodín)
            return rutSolicitante.includes(rutBuscadoLimpio);
        });
        
        // Si el filtro de RUT se aplica, ya no necesitamos el filtro de fecha aquí, 
        // porque ya se aplicó en la consulta de Supabase.
    }


    const tbody = document.getElementById("tabla-historial");
    const sinDatos = document.getElementById("sin-datos");
    tbody.innerHTML = "";

    if (error || solicitudes.length === 0) {
        console.error("Error al cargar solicitudes o no hay datos:", error);
        sinDatos.style.display = "block";
        return;
    }

    sinDatos.style.display = "none";

    // 3. Mapeo de datos
    const solicitudesConMateriales = await Promise.all(solicitudes.map(async s => {
        // Extraemos el RUT del JOIN
        const solicitanteRut = s.usuarios ? s.usuarios.rut : 'N/A';
        
        const { data: materiales } = await supabaseClient
            .from('materiales_solicitados')
            .select('*')
            .eq('id_solicitud', s.id);
        
        return { ...s, materiales, solicitanteRut };
    }));


    solicitudesConMateriales.forEach(s => {
        const materialesJson = JSON.stringify(s.materiales).replace(/"/g, '&quot;'); 
        
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="num">${s.id}</td>
            <td class="num">${s.solicitanteRut}</td> 
            <td>${s.docente}</td> 
            <td>${s.asignatura}</td>
            <td>${s.email}</td>
            <td>${fechaSupabase(s.fecha_entrega).toLocaleDateString()}</td>
            <td>
                <button class="btn-sm btn-secondary btn-materiales" onclick='verMateriales(${materialesJson})'>Ver</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

/* ------------------ MODAL MATERIALES Y CIERRE ------------------ */
function verMateriales(materiales) {
    const tbody = document.getElementById("modal-body-materiales");
    tbody.innerHTML = "";
    materiales.forEach(m => {
        tbody.innerHTML += `<tr><td>${m.material}</td><td>${m.cantidad}</td></tr>`;
    });
    document.getElementById("modal-materiales").style.display = "flex";
}

function cerrarModal() {
    document.getElementById("modal-materiales").style.display = "none";
}

/* ------------------ EVENTO DE BÚSQUEDA ------------------ */
document.getElementById("btn-buscar").addEventListener("click", () => {
    const desde = document.getElementById("desde").value;
    const hasta = document.getElementById("hasta").value;
    
    const rut_input = document.getElementById("filtro-rut").value;
    const rutLimpio = limpiarRut(rut_input);

    const filtros = {
        desde: desde,
        hasta: hasta,
        rut: rutLimpio 
    };

    cargarHistorial(filtros);
});
</script>
</body>
</html>
